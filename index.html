<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBLIOTECA MEDIA</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .imdb-btn-active { background-color: #f5c518; color: #000000; }
        .imdb-btn-active:hover { background-color: #e2b616; }
        .imdb-btn-inactive { background-color: #374151; color: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-photo-film text-blue-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wider text-white uppercase">BIBLIOTECA MEDIA</h1>
                <span id="admin-badge" class="hidden px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-900 text-green-300 border border-green-700 animate-pulse">ADMIN</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="add-new-btn" onclick="openModal('add')" class="hidden px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-green-950/30 whitespace-nowrap">
                    <i class="fa-solid fa-plus mr-1.5"></i> Adaugă element nou
                </button>
                <button id="admin-toggle-btn" onclick="toggleAdminMode()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-blue-950/30 whitespace-nowrap">
                    <i class="fa-solid fa-lock-open mr-1.5"></i> Actualizare date
                </button>
            </div>
        </div>
        
        <div class="max-w-7xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto">
            <button onclick="switchCategory('filme')" id="btn-filme" class="px-5 py-2 rounded-lg text-sm font-bold uppercase transition whitespace-nowrap bg-blue-600 text-white shadow-md">
                Filme & Seriale
            </button>
            <button onclick="switchCategory('muzica')" id="btn-muzica" class="px-5 py-2 rounded-lg text-sm font-bold uppercase transition whitespace-nowrap bg-gray-750 text-gray-400 hover:bg-gray-700">
                Muzica
            </button>
            <button onclick="switchCategory('carti')" id="btn-carti" class="px-5 py-2 rounded-lg text-sm font-bold uppercase transition whitespace-nowrap bg-gray-750 text-gray-400 hover:bg-gray-700">
                Carti
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <section class="bg-gray-800 rounded-2xl border border-gray-700 p-5 shadow-xl">
            <h2 class="text-md font-bold tracking-wide text-gray-300 uppercase mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-blue-500 text-sm"></i> Căutare
            </h2>
            
            <form id="search-form" onsubmit="handleSearch(event)" class="space-y-4">
                <div id="filters-container" class="flex flex-col md:flex-row md:items-end gap-4 w-full">
                    </div>

                <div class="flex items-center gap-3 pt-2">
                    <button type="submit" class="px-5 py-2 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white font-bold text-sm rounded-lg transition shadow-md">
                        Lansează Căutarea
                    </button>
                    <button type="button" onclick="resetCriteria()" class="px-5 py-2 bg-gray-600 hover:bg-gray-500 border border-gray-500 text-gray-200 font-bold text-sm rounded-lg transition">
                        Resetează Criterii
                    </button>
                </div>
            </form>
        </section>

        <section class="bg-gray-800 rounded-2xl border border-gray-700 p-5 shadow-xl flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-md font-bold tracking-wide text-gray-300 uppercase flex items-center gap-2">
                    <i class="fa-solid fa-list-ul text-blue-500 text-sm"></i> Rezultate
                </h2>
                <span id="item-count" class="text-xs bg-gray-700 text-gray-300 px-2.5 py-1 rounded-md font-mono font-bold">0 elemente identificate</span>
            </div>
            
            <div class="overflow-x-auto rounded-xl border border-gray-700">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr id="table-header-row" class="bg-gray-750 border-b border-gray-700 text-gray-300 text-xs font-bold uppercase tracking-wider">
                            </tr>
                    </thead>
                    <tbody id="data-tbody" class="text-sm divide-y divide-gray-700/60 text-gray-300">
                        </tbody>
                </table>
            </div>
        </section>

    </main>

    <div id="crud-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden overflow-y-auto">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-4xl p-6 shadow-2xl relative my-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="flex items-center justify-between border-b border-gray-700 pb-3 mb-5">
                <h2 class="text-lg font-bold text-white tracking-wide uppercase flex items-center gap-2">
                    <i class="fa-solid fa-square-poll-horizontal text-blue-500"></i> Inserare caracteristici
                </h2>
                <span id="modal-category-badge" class="text-[10px] bg-blue-900/50 text-blue-300 px-2 py-0.5 rounded border border-blue-800 uppercase font-bold tracking-widest">CATEGORIE</span>
            </div>

            <form id="crud-form" onsubmit="saveElement(event)">
                <input type="hidden" id="form-edit-index">
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                    
                    <div id="dynamic-form-fields" class="lg:col-span-2 space-y-4">
                        </div>

                    <div class="flex flex-col items-center justify-start border-l border-gray-700/50 lg:pl-6 pt-4 lg:pt-0 sticky top-0">
                        <label id="form-image-label" class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Imagine</label>
                        
                        <div id="image-wrapper" class="flex items-center justify-center bg-gray-900 border-2 border-dashed border-gray-600 rounded-xl overflow-hidden shadow-inner p-1.5 transition-all duration-200">
                            <div id="image-preview-container" class="w-full h-full flex flex-col items-center justify-center text-center p-1">
                                <i id="image-placeholder-icon" class="fa-regular fa-image text-2xl text-gray-600 mb-1"></i>
                                <span id="image-placeholder-text" class="text-[10px] text-gray-500">Fără imagine</span>
                                <img id="image-preview-element" class="hidden w-full h-full object-cover rounded-md" src="" alt="Preview">
                            </div>
                        </div>
                    </div>

                </div>

                <div class="border-t border-gray-700 mt-6 pt-4 flex flex-wrap items-center justify-between gap-3">
                    <div>
                        <button type="button" id="form-delete-btn" onclick="deleteCurrentElement()" class="hidden px-5 py-2 bg-red-650 hover:bg-red-700 text-white font-bold text-sm rounded-lg transition shadow-md">
                            Șterge
                        </button>
                    </div>
                    <div class="flex items-center gap-3 ml-auto">
                        <button type="button" onclick="resetFormFields()" class="px-5 py-2 bg-gray-600 hover:bg-gray-500 text-gray-200 font-bold text-sm rounded-lg transition">
                            Resetează
                        </button>
                        <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-lg transition shadow-lg shadow-blue-900/20">
                            Salvează
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "bra$ov4";
        let isAdmin = false; 
        let currentCategory = 'filme';
        let activeFilters = {};

        let database = { 
            filme: [
                { cod: "F001", titlu: "The Shawshank Redemption", tip: "Film", status: "Vizionat", gen: "Drama", an: "1994", regizor: "Frank Darabont", durata: "142", actori: "Tim Robbins, Morgan Freeman", imdb: "https://www.imdb.com/title/tt0111161/", url_img: "https://m.media-amazon.com/images/M/MV5BNDE3ODcxNzM1NV5BMl5BanBnXkFtZTgwOTg0MTAwNzE@._V1_.jpg" }
            ], 
            muzica: [
                { cod: "M001", titlu: "Bohemian Rhapsody", tip: "Single", autor: "Queen", gen: "Rock", an: "1975", film: "Bohemian Rhapsody (2018)", extras: "A Night at the Opera", url_img: "https://m.media-amazon.com/images/I/71u9SgS89SL._SL1500_.jpg" }
            ], 
            carti: [
                { cod: "C001", titlu: "Tata bogat, tata sarac", tip: "Electronic", autor: "Robert Kiyosaki", gen: "Finante", an: "1997", pagini: "207", editura: "Curtea Veche", colectie: "Carti Cheie", seria: "", url_img: "https://www.curteaveche.ro/media/catalog/product/cache/1/image/9df78eab33525d08d6e5fb8d27136e95/t/a/tata-bogat-tata-sarac-editia-v-robert-t-kiyosaki.jpg" }
            ] 
        };

        if (localStorage.getItem('biblioteca_media_db')) {
            database = JSON.parse(localStorage.getItem('biblioteca_media_db'));
        } else {
            localStorage.setItem('biblioteca_media_db', JSON.stringify(database));
        }

        function resetFiltersObject() {
            activeFilters = { tip: "Toate", status: "Toate", text1: "", text2: "" };
        }

        function switchCategory(cat) {
            currentCategory = cat;
            
            ['filme', 'muzica', 'carti'].forEach(c => {
                const btn = document.getElementById(`btn-${c}`);
                if (c === cat) {
                    btn.className = "px-5 py-2 rounded-lg text-sm font-bold uppercase transition whitespace-nowrap bg-blue-600 text-white shadow-md";
                } else {
                    btn.className = "px-5 py-2 rounded-lg text-sm font-bold uppercase transition whitespace-nowrap bg-gray-750 text-gray-400 hover:bg-gray-700";
                }
            });

            resetFiltersObject();
            buildFiltersUI();
            buildTableHeaderUI();
            renderTable();
        }

        function buildFiltersUI() {
            const container = document.getElementById('filters-container');
            container.innerHTML = '';

            if (currentCategory === 'filme') {
                container.innerHTML = `
                    <div class="flex flex-col shrink-0 min-w-[140px]">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Tip Conținut</label>
                        <select id="filter-tip" class="w-full px-3 py-1.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
                            <option value="Toate">Toate</option>
                            <option value="Film">Film</option>
                            <option value="Serial">Serial</option>
                        </select>
                    </div>
                    <div class="flex flex-col shrink-0 min-w-[150px]">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Status vizionare</label>
                        <select id="filter-status" class="w-full px-3 py-1.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
                            <option value="Toate">Toate</option>
                            <option value="Vizionat">Vizionat</option>
                            <option value="De vizionat">De vizionat</option>
                            <option value="In asteptare">In asteptare</option>
                        </select>
                    </div>
                    <div class="flex flex-col flex-1">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Caută după Actor</label>
                        <input type="text" id="filter-text1" placeholder="Scrie actor..." class="w-full px-3 py-1.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="flex flex-col flex-1">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Caută după Titlu</label>
                        <input type="text" id="filter-text2" placeholder="Scrie titlu..." class="w-full px-3 py-1.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                    </div>
                `;
            } else if (currentCategory === 'muzica') {
                container.innerHTML = `
                    <div class="flex flex-col shrink-0 min-w-[140px]">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Tip Lansare</label>
                        <select id="filter-tip" class="w-full px-3 py-1.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
                            <option value="Toate">Toate</option>
                            <option value="Album">Album</option>
                            <option value="Single">Single</option>
                        </select>
                    </div>
                    <div class="flex flex-col flex-1">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Caută după Artist/Trupă</label>
                        <input type="text" id="filter-text1" placeholder="Scrie artist..." class="w-full px-3 py-1.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="flex flex-col flex-1">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Caută după Titlu</label>
                        <input type="text" id="filter-text2" placeholder="Scrie titlu..." class="w-full px-3 py-1.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                    </div>
                `;
            } else if (currentCategory === 'carti') {
                container.innerHTML = `
                    <div class="flex flex-col shrink-0 min-w-[140px]">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Tip Format</label>
                        <select id="filter-tip" class="w-full px-3 py-1.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
                            <option value="Toate">Toate</option>
                            <option value="Tiparit">Tiparit</option>
                            <option value="Electronic">Electronic</option>
                        </select>
                    </div>
                    <div class="flex flex-col flex-1">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Caută după Autor</label>
                        <input type="text" id="filter-text1" placeholder="Scrie autor..." class="w-full px-3 py-1.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="flex flex-col flex-1">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Caută după Titlu</label>
                        <input type="text" id="filter-text2" placeholder="Scrie titlu..." class="w-full px-3 py-1.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                    </div>
                `;
            }

            if (document.getElementById('filter-tip')) document.getElementById('filter-tip').value = activeFilters.tip || "Toate";
            if (document.getElementById('filter-status')) document.getElementById('filter-status').value = activeFilters.status || "Toate";
            if (document.getElementById('filter-text1')) document.getElementById('filter-text1').value = activeFilters.text1 || "";
            if (document.getElementById('filter-text2')) document.getElementById('filter-text2').value = activeFilters.text2 || "";
        }

        function buildTableHeaderUI() {
            const headerRow = document.getElementById('table-header-row');
            let actionsHtml = isAdmin ? `<th class="p-3 text-center w-24">Acțiuni</th>` : '';
            
            if (currentCategory === 'filme') {
                headerRow.innerHTML = `
                    <th class="p-3 w-16">Cod</th>
                    <th class="p-3">Titlu Original / Română</th>
                    <th class="p-3 w-20">Tip</th>
                    <th class="p-3 w-28">Status</th>
                    <th class="p-3">Regizor / An / Durată</th>
                    <th class="p-3">Distribuție (Actori)</th>
                    <th class="p-3">Gen</th>
                    <th class="p-3 text-center w-20">Link</th>
                    ${actionsHtml}
                `;
            } else if (currentCategory === 'muzica') {
                headerRow.innerHTML = `
                    <th class="p-3 w-16">Cod</th>
                    <th class="p-3">Artist / Trupă</th>
                    <th class="p-3">Titlu Piese / Album</th>
                    <th class="p-3 w-24">Tip</th>
                    <th class="p-3">Gen / Detalii / Film</th>
                    ${actionsHtml}
                `;
            } else if (currentCategory === 'carti') {
                headerRow.innerHTML = `
                    <th class="p-3 w-16">Cod</th>
                    <th class="p-3">Autor</th>
                    <th class="p-3">Titlu Carte</th>
                    <th class="p-3 w-28">Format / Editură</th>
                    <th class="p-3">Domeniu / Detalii / Seria</th>
                    ${actionsHtml}
                `;
            }
        }

        function handleSearch(event) {
            event.preventDefault();
            if (document.getElementById('filter-tip')) activeFilters.tip = document.getElementById('filter-tip').value;
            if (document.getElementById('filter-status')) activeFilters.status = document.getElementById('filter-status').value;
            if (document.getElementById('filter-text1')) activeFilters.text1 = document.getElementById('filter-text1').value.trim().toLowerCase();
            if (document.getElementById('filter-text2')) activeFilters.text2 = document.getElementById('filter-text2').value.trim().toLowerCase();
            renderTable();
        }

        function resetCriteria() {
            resetFiltersObject();
            buildFiltersUI();
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('data-tbody');
            tbody.innerHTML = '';

            const list = database[currentCategory] || [];
            let counter = 0;

            list.forEach((item, index) => {
                if (activeFilters.tip && activeFilters.tip !== "Toate" && item.tip !== activeFilters.tip) return;
                if (currentCategory === 'filme' && activeFilters.status && activeFilters.status !== "Toate" && item.status !== activeFilters.status) return;
                
                if (activeFilters.text1) {
                    if (currentCategory === 'filme') {
                        const actori = item.actori ? item.actori.toLowerCase() : "";
                        if (!actori.includes(activeFilters.text1)) return;
                    } else if (currentCategory === 'muzica' || currentCategory === 'carti') {
                        const autor = item.autor ? item.autor.toLowerCase() : "";
                        if (!autor.includes(activeFilters.text1)) return;
                    }
                }

                if (activeFilters.text2) {
                    const titlu = item.titlu ? item.titlu.toLowerCase() : "";
                    if (!titlu.includes(activeFilters.text2)) return;
                }

                counter++;
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-750/40 transition border-b border-gray-700/40 align-middle";

                let actionTd = isAdmin ? `
                    <td class="p-3 text-center space-x-1 whitespace-nowrap">
                        <button onclick="openModal('edit', ${index})" class="p-1.5 text-blue-400 hover:text-blue-300 hover:bg-gray-700 rounded-lg transition" title="Modifică (CRUD)"><i class="fa-solid fa-pen-to-square"></i></button>
                    </td>
                ` : '';

                if (currentCategory === 'filme') {
                    const hasImdb = item.imdb && item.imdb.trim() !== "";
                    const imdbBtnClass = hasImdb ? 'imdb-btn-active' : 'imdb-btn-inactive';
                    const imdbAttr = hasImdb ? `href="${item.imdb}" target="_blank"` : `onclick="alert('Fără link IMDB.')"`;

                    tr.innerHTML = `
                        <td class="p-3 font-mono text-xs text-blue-400 font-bold">${item.cod || ''}</td>
                        <td class="p-3"><div class="font-semibold text-white">${item.titlu}</div></td>
                        <td class="p-3 text-xs">${item.tip || 'Film'}</td>
                        <td class="p-3 text-xs font-medium ${item.status === 'Vizionat' ? 'text-green-400' : 'text-amber-400'}">${item.status || 'De vizionat'}</td>
                        <td class="p-3 text-xs text-gray-400">${item.regizor || '-'} / ${item.an || '-'} / ${item.durata ? item.durata+' min' : '-'}</td>
                        <td class="p-3 text-xs text-gray-400 italic">${item.actori || '-'}</td>
                        <td class="p-3 text-xs text-gray-400">${item.gen || ''}</td>
                        <td class="p-3 text-center">
                            <a ${imdbAttr} class="${imdbBtnClass} px-2 py-0.5 rounded text-[10px] font-extrabold tracking-tight inline-flex items-center gap-1 transition shadow-sm cursor-pointer">
                                <i class="fa-brands fa-imdb text-sm"></i> IMDB
                            </a>
                        </td>
                        ${actionTd}
                    `;
                } else if (currentCategory === 'muzica') {
                    tr.innerHTML = `
                        <td class="p-3 font-mono text-xs text-blue-400 font-bold">${item.cod || ''}</td>
                        <td class="p-3 font-semibold text-white">${item.autor || '-'}</td>
                        <td class="p-3 text-gray-300 font-medium">${item.titlu}</td>
                        <td class="p-3 text-xs">${item.tip || 'Album'}</td>
                        <td class="p-3 text-xs text-gray-400">${item.gen || ''} ${item.extras ? ' / '+item.extras : ''} ${item.film ? ' / Film: '+item.film : ''}</td>
                        ${actionTd}
                    `;
                } else if (currentCategory === 'carti') {
                    tr.innerHTML = `
                        <td class="p-3 font-mono text-xs text-blue-400 font-bold">${item.cod || ''}</td>
                        <td class="p-3 font-semibold text-white">${item.autor || '-'}</td>
                        <td class="p-3 text-gray-300 font-medium">${item.titlu}</td>
                        <td class="p-3 text-xs">${item.tip || 'Tiparit'} ${item.editura ? ' / '+item.editura : ''}</td>
                        <td class="p-3 text-xs text-gray-400">${item.gen || ''} ${item.pagini ? ' / '+item.pagini+' pag.' : ''} ${item.seria ? ' / Seria: '+item.seria : ''}</td>
                        ${actionTd}
                    `;
                }

                tbody.appendChild(tr);
            });

            document.getElementById('item-count').textContent = `${counter} elemente identificate`;
        }

        // RECALIBRARE GEOMETRICĂ LA JUMĂTATE (1/2) DUPĂ PROTOCOL
        function applyImageGeometry() {
            const wrapper = document.getElementById('image-wrapper');
            if (currentCategory === 'filme') {
                wrapper.style.width = '160px';
                wrapper.style.height = '225px';
                document.getElementById('form-image-label').textContent = "Afiș (160x225)";
                document.getElementById('modal-category-badge').textContent = "Filme & Seriale";
            } else if (currentCategory === 'muzica') {
                wrapper.style.width = '175px';
                wrapper.style.height = '175px';
                document.getElementById('form-image-label').textContent = "Copertă (175x175)";
                document.getElementById('modal-category-badge').textContent = "Muzică";
            } else if (currentCategory === 'carti') {
                wrapper.style.width = '150px';
                wrapper.style.height = '225px';
                document.getElementById('form-image-label').textContent = "Copertă (150x225)";
                document.getElementById('modal-category-badge').textContent = "Cărți";
            }
        }

        function generateFormFieldsHTML() {
            const container = document.getElementById('dynamic-form-fields');
            
            if (currentCategory === 'filme') {
                container.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="flex flex-col">
                            <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Cod Element *</label>

        function toggleAdminMode() {
            if (!isAdmin) {
                const pass = prompt("Introduceți parola de administrare pentru securizarea datelor:");
                if (pass === null) return;
                
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    setAdminUI(true);
                } else {
                    alert("Parolă incorectă!");
                }
            } else {
                isAdmin = false;
                setAdminUI(false);
            }
            buildTableHeaderUI();
            renderTable();
        }

        function setAdminUI(enabled) {
            const toggleBtn = document.getElementById('admin-toggle-btn');
            const addBtn = document.getElementById('add-new-btn');
            const badge = document.getElementById('admin-badge');

            if (enabled) {
                toggleBtn.innerHTML = '<i class="fa-solid fa-right-from-bracket mr-1.5"></i> Blocare date';
                toggleBtn.className = "px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-red-950/30 whitespace-nowrap";
                addBtn.classList.remove('hidden');
                badge.classList.remove('hidden');
            } else {
                toggleBtn.innerHTML = '<i class="fa-solid fa-lock-open mr-1.5"></i> Actualizare date';
                toggleBtn.className = "px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-blue-950/30 whitespace-nowrap";
                addBtn.classList.add('hidden');
                badge.classList.add('hidden');
                closeModal();
            }
        }

        function openModal(mode, index = null) {
            if (!isAdmin) return;
            generateFormFieldsHTML();
            applyImageGeometry();
            
            const modal = document.getElementById('crud-modal');
            const deleteBtn = document.getElementById('form-delete-btn');
            const codInput = document.getElementById('form-cod');
            
            modal.classList.remove('hidden');
            
            if (mode === 'add') {
                document.getElementById('form-edit-index').value = "";
                deleteBtn.classList.add('hidden');
                codInput.disabled = false;
                codInput.classList.remove('opacity-50', 'cursor-not-allowed');
                resetFormFields();
            } else if (mode === 'edit' && index !== null) {
                document.getElementById('form-edit-index').value = index;
                deleteBtn.classList.remove('hidden');
                codInput.disabled = true;
                codInput.classList.add('opacity-50', 'cursor-not-allowed');
                fillFormValues(index);
            }
        }

        function closeModal() {
            document.getElementById('crud-modal').classList.add('hidden');
        }

        function updateImagePreview(url) {
            const icon = document.getElementById('image-placeholder-icon');
            const text = document.getElementById('image-placeholder-text');
            const img = document.getElementById('image-preview-element');

            if (url && url.trim() !== "") {
                img.src = url;
                img.classList.remove('hidden');
                icon.classList.add('hidden');
                text.classList.add('hidden');
            } else {
                img.src = "";
                img.classList.add('hidden');
                icon.classList.remove('hidden');
                text.classList.remove('hidden');
            }
        }

        function fillFormValues(index) {
            const item = database[currentCategory][index];
            document.getElementById('form-cod').value = item.cod || '';
            document.getElementById('form-titlu').value = item.titlu || '';
            document.getElementById('form-tip').value = item.tip || '';
            if(document.getElementById('form-gen')) document.getElementById('form-gen').value = item.gen || '';
            if(document.getElementById('form-an')) document.getElementById('form-an').value = item.an || '';
            if(document.getElementById('form-url-img')) {
                document.getElementById('form-url-img').value = item.url_img || '';
                updateImagePreview(item.url_img);
            }

            if (currentCategory === 'filme') {
                document.getElementById('form-status').value = item.status || 'De vizionat';
                document.getElementById('form-regizor').value = item.regizor || '';
                document.getElementById('form-durata').value = item.durata || '';
                document.getElementById('form-actori').value = item.actori || '';
                document.getElementById('form-imdb').value = item.imdb || '';
            } else if (currentCategory === 'muzica') {
                document.getElementById('form-autor').value = item.autor || '';
                document.getElementById('form-film').value = item.film || '';
                document.getElementById('form-extras').value = item.extras || '';
            } else if (currentCategory === 'carti') {
                document.getElementById('form-autor').value = item.autor || '';
                document.getElementById('form-pagini').value = item.pagini || '';
                document.getElementById('form-editura').value = item.editura || '';
                document.getElementById('form-colectie').value = item.colectie || '';
                document.getElementById('form-seria').value = item.seria || '';
            }
        }

        function saveElement(event) {
            event.preventDefault();
            if (!isAdmin) return;

            const idxStr = document.getElementById('form-edit-index').value;
            const cod = document.getElementById('form-cod').value.trim();
            const titlu = document.getElementById('form-titlu').value.trim();
            const tip = document.getElementById('form-tip').value;
            const gen = document.getElementById('form-gen') ? document.getElementById('form-gen').value.trim() : '';
            const an = document.getElementById('form-an') ? document.getElementById('form-an').value.trim() : '';
            const url_img = document.getElementById('form-url-img') ? document.getElementById('form-url-img').value.trim() : '';

            let item = { cod, titlu, tip, gen, an, url_img };

            if (currentCategory === 'filme') {
                item.status = document.getElementById('form-status').value;
                item.regizor = document.getElementById('form-regizor').value.trim();
                item.durata = document.getElementById('form-durata').value.trim();
                item.actori = document.getElementById('form-actori').value.trim();
                item.imdb = document.getElementById('form-imdb').value.trim();
            } else if (currentCategory === 'muzica') {
                item.autor = document.getElementById('form-autor').value.trim();
                item.film = document.getElementById('form-film').value.trim();
                item.extras = document.getElementById('form-extras').value.trim();
            } else if (currentCategory === 'carti') {
                item.autor = document.getElementById('form-autor').value.trim();
                item.pagini = document.getElementById('form-pagini').value.trim();
                item.editura = document.getElementById('form-editura').value.trim();
                item.colectie = document.getElementById('form-colectie').value.trim();
                item.seria = document.getElementById('form-seria').value.trim();
            }

            if (idxStr === "") {
                if (database[currentCategory].some(x => x.cod.toLowerCase() === cod.toLowerCase())) {
                    alert("Atenție! Acest Cod Element există deja în catalog.");
                    return;
                }
                database[currentCategory].push(item);
            } else {
                const index = parseInt(idxStr);
                database[currentCategory][index] = item;
            }

            localStorage.setItem('biblioteca_media_db', JSON.stringify(database));
            closeModal();
            renderTable();
        }

        function deleteCurrentElement() {
            if (!isAdmin) return;
            const idxStr = document.getElementById('form-edit-index').value;
            if (idxStr !== "") {
                if (confirm("Sigur doriți să ștergeți definitiv acest element din catalog?")) {
                    database[currentCategory].splice(parseInt(idxStr), 1);
                    localStorage.setItem('biblioteca_media_db', JSON.stringify(database));
                    closeModal();
                    renderTable();
                }
            }
        }

        function resetFormFields() {
            const idx = document.getElementById('form-edit-index').value;
            document.getElementById('crud-form').reset();
            document.getElementById('form-edit-index').value = idx;
            updateImagePreview("");
        }

        resetFiltersObject();
        switchCategory('filme');
