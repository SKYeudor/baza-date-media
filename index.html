<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBLIOTECA MEDIA</title>
    <link rel="icon" type="image/png" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-photo-film text-blue-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wider text-white uppercase">BIBLIOTECA MEDIA</h1>
                <span id="admin-badge" class="hidden px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-900 text-green-300 border border-green-700 animate-pulse">ADMIN</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="add-new-btn" onclick="openModal('add')" class="hidden px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-green-950/30 whitespace-nowrap cursor-pointer">
                    <i class="fa-solid fa-plus mr-1.5"></i> Inserare caracteristici
                </button>
                <button id="admin-toggle-btn" onclick="toggleAdminMode()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-blue-950/30 whitespace-nowrap cursor-pointer">
                    <i class="fa-solid fa-lock-open mr-1.5"></i> Actualizare date
                </button>
            </div>
        </div>
        <div class="max-w-7xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto">
            <button onclick="switchCategory('filme')" id="btn-filme" class="px-5 py-2 rounded-lg text-sm font-bold uppercase transition whitespace-nowrap bg-blue-600 text-white shadow-md cursor-pointer">Filme & Seriale</button>
            <button onclick="switchCategory('muzica')" id="btn-muzica" class="px-5 py-2 rounded-lg text-sm font-bold uppercase transition whitespace-nowrap bg-gray-750 text-gray-400 hover:bg-gray-700 cursor-pointer">Muzica</button>
            <button onclick="switchCategory('carti')" id="btn-carti" class="px-5 py-2 rounded-lg text-sm font-bold uppercase transition whitespace-nowrap bg-gray-750 text-gray-400 hover:bg-gray-700 cursor-pointer">Carti</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <section class="bg-gray-800 rounded-2xl border border-gray-700 p-5 shadow-xl">
            <h2 class="text-md font-bold tracking-wide text-gray-300 uppercase mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-blue-500 text-sm"></i> Căutare
            </h2>
            <form id="search-form" onsubmit="handleSearch(event)" class="space-y-4">
                <div id="filters-container" class="flex flex-wrap items-end gap-4 w-full"></div>
                <div class="flex items-center gap-3 pt-2">
                    <button type="submit" class="px-5 py-2 bg-linear-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 border border-blue-500 text-white font-bold text-sm rounded-lg transition shadow-lg shadow-blue-950/40 cursor-pointer"><i class="fa-solid fa-magnifying-glass mr-1.5"></i> Lansează Căutarea</button>
                    <button type="button" onclick="resetCriteria()" class="px-5 py-2 bg-linear-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 border border-amber-500 text-white font-bold text-sm rounded-lg transition shadow-lg shadow-orange-950/30 cursor-pointer"><i class="fa-solid fa-rotate-left mr-1.5"></i> Resetează Criterii</button>
                </div>
            </form>
        </section>

        <section class="bg-gray-800 rounded-2xl border border-gray-700 p-5 shadow-xl flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-md font-bold tracking-wide text-gray-300 uppercase flex items-center gap-2">
                    <i class="fa-solid fa-list-ul text-blue-500 text-sm"></i> Rezultate
                </h2>
                <span id="item-count" class="text-xs bg-gray-700 text-gray-300 px-2.5 py-1 rounded-md font-mono font-bold">0 elemente identificate</span>
            </div>
            <div class="overflow-x-auto rounded-xl border border-gray-700">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr id="table-header-row" class="bg-gray-750 border-b border-gray-700 text-gray-300 text-xs font-bold uppercase tracking-wider"></tr>
                    </thead>
                    <tbody id="data-tbody" class="text-sm divide-y divide-gray-700/60 text-gray-300"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="password-modal" class="fixed inset-0 bg-black/80 z-60 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-xs p-5 shadow-2xl relative">
            <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i class="fa-solid fa-key text-blue-500"></i> Securizare date
            </h3>
            <input type="password" id="password-input" onkeydown="if(event.key === 'Enter') verifyAdminPassword()" placeholder="Introdu parola..." class="w-full px-3 py-1.5 bg-gray-900 border border-gray-600 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 mb-4">
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closePasswordModal()" class="px-3 py-1.5 bg-gray-600 hover:bg-gray-500 text-gray-200 text-xs font-bold rounded-lg transition cursor-pointer">Anulează</button>
                <button type="button" onclick="verifyAdminPassword()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg transition shadow-md cursor-pointer">Confirmă</button>
            </div>
        </div>
    </div>

    <div id="crud-modal" class="fixed inset-0 bg-black/80 z-60 flex justify-center p-4 hidden overflow-y-auto items-start pt-24">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-4xl p-6 shadow-2xl relative my-auto">
            <button type="button" onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors text-xl z-50 p-2 cursor-pointer" title="Închide">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="flex items-center justify-between border-b border-gray-700 pb-3 mb-5 pr-10">
                <h2 class="text-lg font-bold text-white tracking-wide uppercase flex items-center gap-2">
                    <i class="fa-solid fa-square-poll-horizontal text-blue-500"></i> Inserare caracteristici
                </h2>
                <span id="modal-category-badge" class="text-[10px] bg-blue-900/50 text-blue-300 px-2 py-0.5 rounded border border-blue-800 uppercase font-bold tracking-widest">CATEGORIE</span>
            </div>

            <form id="crud-form" onsubmit="saveElement(event)">
                <input type="hidden" id="form-edit-index">
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                    <div id="dynamic-form-fields" class="lg:col-span-2 space-y-4"></div>
                    
                    <div class="flex flex-col items-center justify-start border-l border-gray-700/50 lg:pl-6 pt-4 lg:pt-0">
                        <label id="form-image-label" class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Imagine</label>
                        <div id="image-wrapper" class="flex items-center justify-center bg-gray-900 border-2 border-dashed border-gray-600 rounded-xl overflow-hidden shadow-inner p-1.5 transition-all duration-200" style="width: 160px; height: 225px;">
                            <div id="image-preview-container" class="w-full h-full flex flex-col items-center justify-center text-center p-0 relative">
                                <i id="image-placeholder-icon" class="fa-regular fa-image text-2xl text-gray-600 mb-1"></i>
                                <span id="image-placeholder-text" class="text-[10px] text-gray-500">Fără imagine</span>
                                <img id="image-preview-element" class="hidden absolute inset-0 w-full h-full object-cover rounded-md" src="" alt="Preview">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="excel-import-zone" class="hidden mt-6 pt-4 border-t border-gray-700 bg-gray-850 p-5 rounded-xl">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 border-b border-gray-700 pb-3">
                        <div class="flex items-center gap-2 text-blue-400 font-bold text-sm uppercase tracking-wide">
                            <i class="fa-solid fa-file-import"></i> Preluare / Import Excel (XLSX)
                        </div>
                    </div>
                    <p class="text-xs text-gray-300 mb-3 bg-gray-900/50 p-3 rounded-lg border border-gray-700/60">
                        <i class="fa-solid fa-circle-info text-blue-400 mr-1"></i> Sistemul va asocia automat datele din tabel cu caracteristicile corespunzătoare formatului curent.
                    </p>
                    <textarea id="excel-paste-area" rows="5" placeholder="Lipește rândurile copiate din Excel aici (Titlu [Tab] Actori/Artist [Tab] Gen...)...." class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-200 font-mono focus:outline-none focus:border-blue-500 placeholder-gray-600 mb-3"></textarea>
                    <div class="text-right">
                        <button type="button" onclick="processExcelPaste()" class="px-5 py-2 bg-green-600 hover:bg-green-700 text-white font-bold text-xs rounded-xl transition shadow-lg cursor-pointer">
                            <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> Execută importul datelor
                        </button>
                    </div>
                </div>

                <div class="border-t border-gray-700 mt-6 pt-4 flex flex-wrap items-center justify-between gap-3">
                    <div>
                        <button type="button" id="form-delete-btn" onclick="deleteCurrentElement()" class="hidden px-5 py-2 bg-red-650 hover:bg-red-700 text-white font-bold text-sm rounded-lg transition shadow-md cursor-pointer">Șterge</button>
                    </div>
                    <div class="flex items-center gap-3 ml-auto">
                        <button type="button" onclick="resetFormFields()" class="px-5 py-2 bg-gray-600 hover:bg-gray-500 text-gray-200 font-bold text-sm rounded-lg transition cursor-pointer">Resetează</button>
                        <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-lg transition shadow-lg cursor-pointer">Salvează</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="details-modal" class="fixed inset-0 bg-black/80 z-60 flex items-center justify-center p-4 hidden">
        <div id="details-card" class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
            <button type="button" onclick="closeDetailsModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors text-xl p-2 cursor-pointer" title="Închide">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="details-layout" class="flex gap-5">
                <img id="details-cover" class="hidden w-28 h-40 object-cover rounded-lg border border-gray-700 flex-shrink-0" src="" alt="Copertă">
                <div class="flex-1 space-y-1">
                    <h3 id="details-titlu" class="text-lg font-bold text-white"></h3>
                    <p id="details-autor" class="text-sm text-gray-300 mb-2"></p>
                    <div id="details-rest" class="text-xs text-gray-400 space-y-1"></div>
                </div>
            </div>
            <div class="border-t border-gray-700 mt-4 pt-4 text-right">
                <button type="button" id="details-edit-btn" onclick="editFromDetails()" class="hidden px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-lg transition cursor-pointer">
                    <i class="fa-solid fa-pen-to-square mr-1"></i> Editează
                </button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="filme.js"></script>
    <script src="muzica.js"></script>
    <script src="carti.js"></script>
    <script src="app.js"></script>
    <script>loadDatabase();</script>
</body>
</html>
